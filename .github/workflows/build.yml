name: Build

on:
  push:
    branches: [main]
    paths-ignore: [".github/workflows/retag.yml", "docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon → .dmg
            bundles: dmg,app
            name: macos-apple-silicon
            target: ""
          - os: macos-15-intel      # Ausweichweg: auf Intel-Mac für Apple Silicon bauen (kürzere Warteschlange)
            bundles: dmg,app
            name: macos-apple-silicon-via-intel
            target: aarch64-apple-darwin
          - os: windows-latest      # Windows 10/11 → Installer (.exe)
            bundles: nsis
            name: windows-x86_64
            target: ""
          - os: ubuntu-22.04        # ältere glibc → läuft auf Linux Mint 21 und 22
            bundles: deb,appimage
            name: linux-x86_64
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tests
        if: matrix.target == ''
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Bauen
        run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: druckerwacht-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Version lesen
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Druckerwacht ${{ steps.ver.outputs.version }}
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/nsis/*.exe
