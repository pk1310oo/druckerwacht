name: Abo-Ausgabe (privat)

# Eigene Ausgabe, deren KI-Designer über das lokal installierte Claude Code mit dem eigenen
# Claude-Abo läuft. Nur per Hand starten (Actions → „Abo-Ausgabe (privat)“ → Run workflow).
# Wird NICHT als Release veröffentlicht – die Dateien liegen nur unter den Artefakten des Laufs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
            name: mac
          - os: windows-latest
            bundles: nsis
            name: windows
          - os: ubuntu-22.04
            bundles: deb,appimage
            name: linux
    runs-on: ${{ matrix.os }}
    env:
      DW_ABO: "1"
      VITE_DW_ABO: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: abo

      - run: npm ci

      - name: Bauen
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: druckerwacht-abo-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
