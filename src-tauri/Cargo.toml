[package]
name = "druckerwacht"
version = "0.8.2"
description = "Live-Überwachung für Creality Ender 3 V3 KE"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/pk1310oo/druckerwacht"

[lib]
name = "druckerwacht_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process", "io-util"] }
futures-util = "0.3"
tokio-tungstenite = "0.30.0"
if-addrs = "0.15.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tauri-plugin-dialog = "2"
base64 = "0.23.1"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
