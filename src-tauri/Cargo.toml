[package]
name = "druckerwacht"
version = "0.13.0"
description = "Überwachen, Slicen und Steuern für Creality-, Klipper-, OctoPrint- und Prusa-Drucker"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/pk1310oo/druckerwacht"

[lib]
name = "druckerwacht_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process", "io-util"] }
futures-util = "0.3"
tokio-tungstenite = "0.30.0"
if-addrs = "0.15.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tauri-plugin-dialog = "2"
base64 = "0.23.1"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
digest_auth = "0.3"

# Menüleisten-Anzeige (Fortschritt neben der Uhr) gibt es nur auf dem Mac
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

# Webcam am Computer: WebKitGTK muss Kamerazugriff erlauben
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_4"] }
